<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>נטלינק | אינדקס אתרים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("nl-theme");if(t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.classList.add("dark")}catch(e){}</script>
<style>
:root{--bg:#F5F2EA;--surface:#FFFFFF;--ink:#1C1917;--muted:#6B6560;--line:#E4DFD3;--accent:#0F6B5C;--on-accent:#fff;--soft:#E3F0EC;--hover:#EFEBE0;--danger:#C0392B;--r:12px;color-scheme:light}
html.dark{--bg:#121413;--surface:#1A1D1C;--ink:#ECEAE4;--muted:#9A9A92;--line:#2B2F2D;--accent:#4FB39E;--on-accent:#08201B;--soft:#17302A;--hover:#232826;--danger:#F0776B;color-scheme:dark}
*{box-sizing:border-box}
html{scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Assistant',system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
svg{flex-shrink:0}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:800;letter-spacing:-.02em;flex-shrink:0}
.brand i{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:48px;padding:0 48px 0 44px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.search input::placeholder{color:var(--muted)}
.search .lead{position:absolute;right:15px;top:14px;color:var(--muted);pointer-events:none}
.search .clear{position:absolute;left:8px;top:8px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:none;place-items:center}
.search.has .clear{display:grid}
.search .clear:hover{background:var(--hover)}
.btn{height:48px;padding:0 20px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:48px;padding:0}
.theme .moon{display:none}html.dark .theme .sun{display:none}html.dark .theme .moon{display:block}

/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;align-items:start}
aside{position:sticky;top:calc(var(--hh,76px) + 20px);max-height:calc(100vh - var(--hh,76px) - 40px);overflow:auto}
.side-title{font-size:13px;font-weight:700;color:var(--muted);margin:0 12px 8px}
nav{display:flex;flex-direction:column;gap:2px}
.cat{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:transparent;text-align:right;font-weight:600;font-size:15.5px;color:var(--ink)}
.cat:hover{background:var(--hover)}
.cat.on{background:var(--accent);color:var(--on-accent)}
.cat span:first-child{display:flex;align-items:center;gap:10px;min-width:0}
.cat .n{font-size:13px;font-weight:700;opacity:.65}
.sep{height:1px;background:var(--line);margin:8px 12px}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;min-height:34px}
.head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.head p{margin:0;color:var(--muted);font-size:14.5px;font-weight:600}
.group{margin-bottom:28px}
.group h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{position:relative;display:flex;align-items:center;gap:14px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);transition:border-color .15s,background .15s}
.row:hover{border-color:var(--accent);background:color-mix(in srgb,var(--soft) 45%,var(--surface))}
.logo{width:46px;height:46px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);padding:3px;flex-shrink:0}
.logo.fb{display:grid;place-items:center;font-weight:800;font-size:19px;color:#fff;border:0;padding:0}
.info{flex:1;min-width:0}
.name{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.name a::after{content:'';position:absolute;inset:0;z-index:1;border-radius:var(--r)}
.dom{font-size:13px;color:var(--muted);direction:ltr;text-align:right;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desc{margin:3px 0 0;font-size:14.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{color:var(--muted);transition:transform .15s,color .15s}
.row:hover .go{color:var(--accent);transform:translateX(-3px)}
.fav{position:relative;z-index:2;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center}
.fav:hover{background:var(--hover);color:#D4900A}
.fav.on{color:#D4900A}.fav.on .ico{fill:currentColor}
mark{background:color-mix(in srgb,#F5C84B 55%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.state{text-align:center;padding:70px 20px;color:var(--muted)}
.state h3{margin:0 0 8px;color:var(--ink);font-size:21px}
.state .btn{margin-top:18px}
.sk{height:74px;border-radius:var(--r);background:linear-gradient(90deg,var(--hover) 25%,var(--line) 50%,var(--hover) 75%);background-size:200% 100%;animation:sh 1.4s infinite;margin-bottom:8px}
@keyframes sh{to{background-position:-200% 0}}

/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.55);display:grid;place-items:center;padding:16px;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.ov.open{opacity:1;visibility:visible}
.modal{width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;transform:translateY(12px);transition:transform .25s}
.ov.open .modal{transform:none}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.mh h2{margin:0;font-size:22px;font-weight:800}
.lead2{margin:0 0 20px;color:var(--muted);font-size:14.5px}
.f{margin-bottom:16px}
.f label{display:block;font-weight:700;font-size:14.5px;margin-bottom:6px}
.f label small{font-weight:500;color:var(--muted)}
.f input,.f textarea{width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
.f input:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft);background:var(--surface)}
.f textarea{min-height:84px;resize:vertical}
.f.bad input{border-color:var(--danger)}
.err{color:var(--danger);font-size:13px;font-weight:600;margin-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:4px 12px;border-radius:100px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:600}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.msg{display:none;margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:700;font-size:14.5px}
.msg.ok{background:var(--soft);color:var(--accent)}.msg.no{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.spin{display:none;width:18px;height:18px;border:2.5px solid color-mix(in srgb,var(--on-accent) 30%,transparent);border-top-color:var(--on-accent);border-radius:50%;animation:rot .7s linear infinite}
.loading .spin{display:block}.loading .tx{display:none}
@keyframes rot{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 22px;border-radius:12px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:all .25s;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:900px){
  .wrap{grid-template-columns:1fr;gap:14px;padding:14px 16px 60px}
  aside{position:sticky;top:var(--hh,120px);z-index:40;max-height:none;overflow:visible;margin:0 -16px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
  .side-title,.sep{display:none}
  nav{flex-direction:row;overflow-x:auto;gap:8px;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .cat{width:auto;flex-shrink:0;border:1.5px solid var(--line);background:var(--surface);border-radius:100px;padding:7px 16px;white-space:nowrap}
  .cat.on{border-color:var(--accent)}
  .cat .n{display:none}
}
@media(max-width:640px){
  .bar{flex-wrap:wrap;padding:12px 16px;gap:10px}
  .brand{font-size:22px}.brand{order:1;margin-inline-end:auto}
  .search{order:3;flex-basis:100%}
  .btn.sug .tx{display:none}.btn.sug{width:48px;padding:0}
  .head h1{font-size:22px}
  .desc{-webkit-line-clamp:2}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><i><svg class="ico" viewBox="0 0 24 24"><path d="M15 7h3a5 5 0 0 1 0 10h-3M9 17H6a5 5 0 0 1 0-10h3M8 12h8"/></svg></i><span>נטלינק</span></div>
    <div class="search" id="searchBox">
      <svg class="ico lead" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" autocomplete="off" aria-label="חיפוש אתר" placeholder="חיפוש לפי שם, תיאור או קטגוריה">
      <button class="clear" id="clear" aria-label="ניקוי חיפוש"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <button class="btn primary sug" id="sugBtn"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="tx">הציעו אתר</span></button>
    <button class="btn icon theme" id="themeBtn" aria-label="החלפת מצב תצוגה">
      <svg class="ico sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2L6 6M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>
      <svg class="ico moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <aside><p class="side-title">קטגוריות</p><nav id="nav" aria-label="קטגוריות"></nav></aside>
  <main>
    <div class="head"><h1 id="title">כל האתרים</h1><p id="count" aria-live="polite"></p></div>
    <div id="out"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
  </main>
</div>

<div class="ov" id="ov">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h2 id="mt">הציעו אתר לנטלינק</h2><button class="btn icon" style="height:40px;width:40px;border:0" id="mx" aria-label="סגירה"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <p class="lead2">ההצעה נשלחת לבדיקה ותתווסף לדף לאחר אישור.</p>
    <form id="form" novalidate>
      <div class="f"><label for="s-name">שם האתר</label><input id="s-name" type="text" placeholder="לדוגמה: ויקיפדיה"></div>
      <div class="f"><label for="s-url">קישור לאתר</label><input id="s-url" type="text" inputmode="url" dir="ltr" style="text-align:right" placeholder="example.com"></div>
      <div class="f"><label for="s-desc">תיאור <small>(רשות)</small></label><textarea id="s-desc" maxlength="140" placeholder="ספרו בקצרה על האתר"></textarea></div>
      <div class="f"><label for="s-cat">קטגוריה <small>(רשות)</small></label><input id="s-cat" type="text" placeholder="בחרו מהרשימה או הקלידו חדשה"><div class="chips" id="catChips"></div></div>
      <div class="f"><label for="s-logo">קישור ללוגו <small>(רשות)</small></label><input id="s-logo" type="text" inputmode="url" dir="ltr" style="text-align:right" placeholder="https://.../logo.png"></div>
      <button type="submit" class="btn primary" style="width:100%" id="send"><span class="tx">שליחת ההצעה</span><span class="spin"></span></button>
      <div class="msg ok" id="ok">ההצעה נשלחה בהצלחה, תודה!</div>
      <div class="msg no" id="no">השליחה נכשלה, אנא נסו שוב.</div>
    </form>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSqW9PU8W3ao33tsiYdwLCKxoENM1zJJsR4LfNrZp1gjLuuuUDH6m13XiVev9LDg8XkpgBwL_ITPkc-/pub?gid=0&single=true&output=csv";
const SUGGEST_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbx6CgLnK2WO983z366MzKHThSxwG6rLkaN_Seim9loWPIFHAn1Norxx924ukMCx2ykqWw/exec";
const $ = id => document.getElementById(id);
const PAL = ['#0F6B5C','#B45309','#9F1239','#1D4ED8','#6D28D9','#0E7490','#4D7C0F','#C2410C','#A21CAF','#475569'];
const color = n => { let h = 0; for(const c of n) h = (h*31 + c.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; };
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fold = t => String(t).toLowerCase().replace(/[\u0591-\u05C7]/g,'').trim();
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } };
const safeUrl = u => { try{ const x = new URL(/^https?:\/\//i.test(u) ? u : 'https://' + u); return /^https?:$/.test(x.protocol) ? x.href : ''; }catch(e){ return ''; } };
const FAV = 'https://www.google.com/s2/favicons?sz=128&domain=';

let sites = [], query = '', cat = 'all', hlRe = null, favs = new Set();
try{ favs = new Set(JSON.parse(localStorage.getItem('nl-favs') || '[]')); }catch(e){}

/* theme */
let dark = document.documentElement.classList.contains('dark');
$('themeBtn').onclick = () => { dark = !dark; document.documentElement.classList.toggle('dark', dark); try{ localStorage.setItem('nl-theme', dark ? 'dark' : 'light'); }catch(e){} };

/* csv */
function parseCSV(t){
  const rows = []; let r = [], f = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i], n = t[i+1];
    if(q){ if(c === '"' && n === '"'){ f += '"'; i++; } else if(c === '"') q = false; else f += c; }
    else if(c === '"') q = true;
    else if(c === ',') { r.push(f); f = ''; }
    else if(c === '\n'){ r.push(f); rows.push(r); r = []; f = ''; }
    else if(c !== '\r') f += c;
  }
  if(f.length || r.length){ r.push(f); rows.push(r); }
  if(!rows.length) return [];
  const h = rows[0].map(x => x.trim());
  return rows.slice(1).filter(r => r.some(v => v.trim())).map(r => { const o = {}; h.forEach((k,i) => o[k] = (r[i] || '').trim()); return o; });
}
const pick = (o, ks) => { for(const k of ks) if(o[k]) return o[k]; return ''; };
function ingest(text){
  sites = parseCSV(text).map(r => ({
    url: safeUrl(pick(r, ['קישור','URL','קישור לאתר'])),
    name: pick(r, ['שם האתר','שם']), desc: pick(r, ['תיאור']),
    logo: pick(r, ['לוגו','קישור ללוגו']), category: pick(r, ['קטגוריה']) || 'כללי'
  })).filter(s => s.url && s.name);
  render();
}
async function load(){
  try{
    const res = await fetch(SHEET_CSV_URL); if(!res.ok) throw 0;
    const text = await res.text(); let prev = null;
    try{ prev = localStorage.getItem('nl-csv'); localStorage.setItem('nl-csv', text); }catch(e){}
    if(text === prev && sites.length) return;
    ingest(text);
  }catch(e){
    if(!sites.length) $('out').innerHTML = '<div class="state"><h3>לא הצלחנו לטעון את רשימת האתרים</h3><p>בדקו את החיבור ונסו שוב.</p><button class="btn primary" id="retry">נסו שוב</button></div>';
    const b = $('retry'); if(b) b.onclick = load;
  }
}

/* render */
function hl(t){ return hlRe ? t.split(hlRe).map((p,i) => i % 2 ? '<mark>' + esc(p) + '</mark>' : esc(p)).join('') : esc(t); }
function row(s){
  const h = hostOf(s.url), ini = esc(s.name.trim().charAt(0)), on = favs.has(s.url);
  const src = s.logo || (h ? FAV + h : '');
  return `<article class="row">
    ${src ? `<img class="logo" src="${esc(src)}" alt="" loading="lazy" data-ini="${ini}" data-host="${esc(h)}" data-c="${color(s.category)}">` : `<div class="logo fb" style="background:${color(s.category)}">${ini}</div>`}
    <div class="info"><h3 class="name"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${hl(s.name)}</a></h3><span class="dom">${esc(h)}</span>${s.desc ? `<p class="desc">${hl(s.desc)}</p>` : ''}</div>
    <button type="button" class="fav${on ? ' on' : ''}" data-url="${esc(s.url)}" aria-pressed="${on}" aria-label="הוספה או הסרה ממועדפים"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg></button>
    <svg class="ico go" viewBox="0 0 24 24"><path d="M17 17L7 7M7 17V7h10"/></svg>
  </article>`;
}
function render(){
  const terms = fold(query).split(/\s+/).filter(Boolean);
  hlRe = terms.length ? new RegExp('(' + terms.map(x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|') + ')','gi') : null;
  const found = terms.length ? sites.filter(s => { const h = fold([s.name, s.desc, s.category, hostOf(s.url)].join(' ')); return terms.every(x => h.includes(x)); }) : sites;
  const cats = [...new Set(sites.map(s => s.category))].sort((a,b) => a.localeCompare(b,'he'));
  const cnt = c => found.filter(s => s.category === c).length;
  const favCount = found.filter(s => favs.has(s.url)).length;
  if(cat !== 'all' && cat !== 'favs' && !cats.includes(cat)) cat = 'all';
  const item = (k, label, n, icon) => `<button class="cat${cat === k ? ' on' : ''}" data-cat="${esc(k)}"><span>${icon || ''}${esc(label)}</span><span class="n">${n}</span></button>`;
  const star = '<svg class="ico" viewBox="0 0 24 24" style="width:17px;height:17px"><path d="M12 3l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.8 6.2 20.9l1.1-6.5L2.6 9.8l6.5-.9z"/></svg>';
  $('nav').innerHTML = item('all','הכל',found.length) + (favs.size ? item('favs','המועדפים שלי',favCount,star) : '') + '<div class="sep"></div>' + cats.map(c => item(c, c, cnt(c))).join('');
  const shown = cat === 'all' ? found : cat === 'favs' ? found.filter(s => favs.has(s.url)) : found.filter(s => s.category === cat);
  $('title').textContent = cat === 'all' ? 'כל האתרים' : cat === 'favs' ? 'המועדפים שלי' : cat;
  $('count').textContent = terms.length ? 'נמצאו ' + shown.length + ' מתוך ' + sites.length : shown.length + ' אתרים';
  if(!shown.length){
    $('out').innerHTML = `<div class="state"><h3>${terms.length ? 'לא נמצאו תוצאות' : cat === 'favs' ? 'אין עדיין מועדפים' : 'עדיין לא נוספו אתרים'}</h3><p>${terms.length ? 'נסו מילות חיפוש אחרות, או הציעו את האתר שחסר.' : cat === 'favs' ? 'סמנו אתר בכוכב כדי למצוא אותו כאן.' : 'הוסיפו שורה בגיליון והדף יתעדכן.'}</p>${terms.length ? '<button class="btn primary" id="sug2">הציעו אתר</button>' : ''}</div>`;
    const b = $('sug2'); if(b) b.onclick = openModal; return;
  }
  const groups = cat === 'all' ? cats.filter(c => shown.some(s => s.category === c)) : [null];
  $('out').innerHTML = groups.map(c => {
    const list = c ? shown.filter(s => s.category === c) : shown;
    return `<section class="group">${c ? `<h2><span style="width:9px;height:9px;border-radius:50%;background:${color(c)}"></span>${esc(c)}</h2>` : ''}<div class="list">${list.map(row).join('')}</div></section>`;
  }).join('');
}

/* events */
$('nav').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if(!b) return;
  cat = b.dataset.cat; render(); window.scrollTo({top: 0, behavior: 'smooth'});
});
$('out').addEventListener('click', e => {
  const b = e.target.closest('.fav'); if(!b) return;
  const u = b.dataset.url, on = !favs.has(u); on ? favs.add(u) : favs.delete(u);
  try{ localStorage.setItem('nl-favs', JSON.stringify([...favs])); }catch(err){}
  const y = scrollY; render(); scrollTo(0, y); toast(on ? 'נוסף למועדפים' : 'הוסר מהמועדפים');
});
document.addEventListener('error', e => {
  const t = e.target; if(!t.classList || !t.classList.contains('logo')) return;
  if(t.dataset.host && !t.dataset.fb && t.src !== FAV + t.dataset.host){ t.dataset.fb = 1; t.src = FAV + t.dataset.host; return; }
  const d = document.createElement('div'); d.className = 'logo fb'; d.style.background = t.dataset.c; d.textContent = t.dataset.ini; t.replaceWith(d);
}, true);
function toast(m){ const t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1700); }

let st; const q = $('q');
function setQuery(v){ query = v; $('searchBox').classList.toggle('has', !!v); render(); }
q.addEventListener('input', () => { clearTimeout(st); $('searchBox').classList.toggle('has', !!q.value); st = setTimeout(() => setQuery(q.value), 120); });
q.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ q.value = ''; setQuery(''); }
  if(e.key === 'Enter'){ const a = $('out').querySelector('.name a'); if(a) a.click(); }
});
$('clear').onclick = () => { q.value = ''; setQuery(''); q.focus(); };
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if((e.key === '/' && !typing) || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k')){ e.preventDefault(); q.focus(); q.select(); }
});

/* modal */
function setErr(id, msg){
  const f = $(id).closest('.f'); let e = f.querySelector('.err');
  if(!msg){ if(e) e.remove(); f.classList.remove('bad'); return; }
  if(!e){ e = document.createElement('div'); e.className = 'err'; f.appendChild(e); }
  e.textContent = msg; f.classList.add('bad');
}
function openModal(){
  const cats = [...new Set(sites.map(s => s.category))].sort((a,b) => a.localeCompare(b,'he'));
  $('catChips').innerHTML = cats.slice(0, 14).map(c => `<button type="button">${esc(c)}</button>`).join('');
  $('ov').classList.add('open'); document.documentElement.style.overflow = 'hidden';
  setTimeout(() => $('s-name').focus(), 60);
}
function closeModal(){ $('ov').classList.remove('open'); document.documentElement.style.overflow = ''; $('sugBtn').focus(); }
$('sugBtn').onclick = openModal; $('mx').onclick = closeModal;
$('ov').addEventListener('click', e => { if(e.target === $('ov')) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('ov').classList.contains('open')) closeModal(); });
$('catChips').addEventListener('click', e => { if(e.target.tagName === 'BUTTON'){ $('s-cat').value = e.target.textContent; } });
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('ok').style.display = $('no').style.display = 'none';
  const p = { name: $('s-name').value.trim(), url: $('s-url').value.trim(), desc: $('s-desc').value.trim(), logo: $('s-logo').value.trim(), category: $('s-cat').value.trim() };
  const u = safeUrl(p.url);
  setErr('s-name', p.name ? '' : 'נא להזין שם לאתר'); setErr('s-url', u ? '' : 'נא להזין קישור תקין');
  if(!p.name || !u) return;
  p.url = u; $('send').classList.add('loading'); $('send').disabled = true;
  try{
    await fetch(SUGGEST_WEB_APP_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(p) });
    $('ok').style.display = 'block'; $('form').reset(); setTimeout(closeModal, 1800);
  }catch(err){ $('no').style.display = 'block'; }
  finally{ $('send').classList.remove('loading'); $('send').disabled = false; }
});

/* boot */
const hdr = document.querySelector('header');
new ResizeObserver(() => document.documentElement.style.setProperty('--hh', hdr.offsetHeight + 'px')).observe(hdr);
try{ const c = localStorage.getItem('nl-csv'); if(c) ingest(c); }catch(e){}
load();
</script>
<script src="https://xnet2.github.io/status/xnet-badge.js"></script>
</body>
</html>
